<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glamour Raid Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style id="appstyle">
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#F5F7FA; --line:#D6DCE6;
  --ink:#1A2132; --muted:#5B6579; --accent:#1C7F86; --accent-ink:#FFFFFF; --accent-soft:#DDF0F1;
  --gold:#A87718; --gold-soft:#F6ECD6; --want:#5B6579; --want-soft:#E6EAF1; --danger:#B03A3A;
  --display:"Marcellus","Trajan Pro",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#11151E; --surface:#191F2C; --surface2:#1F2636; --line:#2C3547;
  --ink:#E4E8F1; --muted:#98A2B7; --accent:#4CC0BF; --accent-ink:#0D1A1B; --accent-soft:#16383B;
  --gold:#E0B456; --gold-soft:#3A2F17; --want:#98A2B7; --want-soft:#262E40; --danger:#E27373;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151E; --surface:#191F2C; --surface2:#1F2636; --line:#2C3547;
  --ink:#E4E8F1; --muted:#98A2B7; --accent:#4CC0BF; --accent-ink:#0D1A1B; --accent-soft:#16383B;
  --gold:#E0B456; --gold-soft:#3A2F17; --want:#98A2B7; --want-soft:#262E40; --danger:#E27373;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
#app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:30px;letter-spacing:.01em}
h2{font-size:20px}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
header p{margin:4px 0 0;max-width:60ch}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.save.ok::before{content:"● ";color:var(--accent)}
.save.busy::before{content:"● ";color:var(--gold)}
.save.local::before{content:"● ";color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--danger);border-color:transparent}
.btn.danger{color:var(--danger)}
select,input[type=text],input[type=number]{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
input[type=number]{width:64px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px}
.grow{flex:1 1 180px}
.notice{background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.group{display:flex;flex-direction:column}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .main .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.slot{font-weight:600}
.cost{font-size:12px;color:var(--muted);white-space:nowrap}
.item.done .slot,.item.done .main>span:first-child{color:var(--muted)}
.status{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.status button{border:0;background:var(--surface2);padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.status button.want[aria-pressed="true"]{background:var(--want-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--want)}
.status button.coffer[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.status button.got[aria-pressed="true"]{background:var(--gold-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}
@media (max-width:620px){
  .item{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main del" "status status"}
  .item .slotcol{display:none}
  .item .main{grid-area:main}
  .item .status{grid-area:status;justify-self:start}
  .item .del{grid-area:del}
  .item .main .slot-inline{display:inline}
}
.slot-inline{display:none}
.ex{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.empty{padding:24px 0;text-align:center;color:var(--muted)}
.calc{display:flex;flex-direction:column;gap:12px}
.calc-raid{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.calc-table{width:100%;border-collapse:collapse;font-size:14px}
.calc-table th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:0 4px 6px}
.calc-table th:first-child{text-align:left}
.calc-table td{padding:5px 4px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.calc-table td:first-child{text-align:left;font-weight:600}
.owned{display:inline-flex;align-items:center;gap:4px}
.owned button{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0;line-height:1}
.owned input{width:44px;text-align:center;padding:3px}
.farm{font-weight:700}
.farm.zero{color:var(--accent)}
.farm.more{color:var(--gold)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.total strong{font-size:22px;font-family:var(--display);font-weight:400}
details.settings summary{cursor:pointer;font-family:var(--display);font-size:18px;list-style:none}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::before{content:"▸ ";color:var(--muted)}
details.settings[open] summary::before{content:"▾ "}
.raid-edit{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.cost-grid{overflow-x:auto}
.cost-grid table{border-collapse:collapse;font-size:13px}
.cost-grid td,.cost-grid th{padding:4px 6px;text-align:left}
.cost-grid select{padding:4px 6px}
.cost-grid input[type=number]{width:56px;padding:4px 6px}
.floors{display:flex;flex-wrap:wrap;gap:8px}
.pick{max-height:380px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.pick h4{margin:0;position:sticky;top:0;background:var(--surface2);padding:8px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.pick label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick label:hover{background:var(--accent-soft)}
.pick label.on{color:var(--muted);cursor:default}
.pick .jobs{font-size:12px;color:var(--muted)}
.pick .pc{font-size:12px;color:var(--muted);white-space:nowrap}
.pick .emptypick{padding:16px 12px;color:var(--muted);font-size:14px}
.floors input{width:90px}
.ic{width:28px;height:28px;border-radius:5px;vertical-align:middle;margin-right:8px;background:var(--surface2);flex:none}
.pick .ic{width:24px;height:24px}
.backup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.backup .msg{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.seg button,.status button{transition:background .15s,border-color .15s,color .15s}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

{"id":11571,"n":"Gordian Neckband of Fending","s":"Necklace","j":"All Classes","i":54934},{"id":11572,"n":"Gordian Neckband of Slaying","s":"Necklace","j":"All Classes","i":54934},{"id":11573,"n":"Gordian Neckband of Aiming","s":"Necklace","j":"All Classes","i":54934},{"id":11574,"n":"Gordian Neckband of Healing","s":"Necklace","j":"All Classes","i":54934},{"id":11575,"n":"Gordian Neckband of Casting","s":"Necklace","j":"All Classes","i":54934},{"id":11576,"n":"Gordian Wristband of Fending","s":"Bracelet","j":"All Classes","i":55739},{"id":11577,"n":"Gordian Wristband of Slaying","s":"Bracelet","j":"All Classes","i":55739},{"id":11578,"n":"Gordian Wristband of Aiming","s":"Bracelet","j":"All Classes","i":55739},{"id":11579,"n":"Gordian Wristband of Healing","s":"Bracelet","j":"All Classes","i":55739},{"id":11580,"n":"Gordian Wristband of Casting","s":"Bracelet","j":"All Classes","i":55739},{"id":11581,"n":"Gordian Ring of Fending","s":"Ring","j":"All Classes","i":54589},{"id":11582,"n":"Gordian Ring of Slaying","s":"Ring","j":"All Classes","i":54589},{"id":11583,"n":"Gordian Ring of Aiming","s":"Ring","j":"All Classes","i":54589},{"id":11584,"n":"Gordian Ring of Healing","s":"Ring","j":"All Classes","i":54589},{"id":11585,"n":"Gordian Ring of Casting","s":"Ring","j":"All Classes","i":54589},{"id":20448,"n":"Gordian Katana","s":"Weapon","j":"SAM","i":36406},{"id":20449,"n":"Gordian Rapier","s":"Weapon","j":"RDM","i":36740}]}</script>
<script id="main">
(function(){
var SLOTS=["Weapon","Gladiator's Arm","Shield","Head","Body","Hands","Legs","Feet","Earrings","Necklace","Bracelet","Ring"];
var SLOT_LABEL={"Gladiator's Arm":"Paladin sword","Shield":"Shield"};
var DEFAULT_COSTS={"Weapon":[3,8],"Gladiator's Arm":[3,5],"Shield":[3,3],"Head":[1,4],"Body":[2,6],"Hands":[1,4],"Legs":[2,6],"Feet":[1,4],"Earrings":[0,3],"Necklace":[0,3],"Bracelet":[0,3],"Ring":[0,3]};
var LS_KEY="glam-ledger-state";
var state=normalize(JSON.parse(document.getElementById("state").textContent));
function normalize(st){
  st.books=st.books||{};st.items=st.items||[];
  (st.raids||[]).forEach(function(r){
    if(!r.tokens)r.tokens=r.floors.map(function(f){return f+" book";});
    if(!r.drops){r.drops={};Object.keys(r.costs).forEach(function(k){r.drops[k]=[r.costs[k][0]];});}
  });
  return st;
}
var CATALOG={};try{CATALOG=JSON.parse(document.getElementById("catalog").textContent);}catch(e){}
var CAT_BY_ID={};Object.keys(CATALOG).forEach(function(k){CATALOG[k].forEach(function(x){CAT_BY_ID[x.id]=x;});});
var JOBS=["PLD","WAR","DRK","GNB","WHM","SCH","AST","SGE","MNK","DRG","NIN","SAM","RPR","VPR","BRD","MCH","DNC","BLM","SMN","RDM","PCT"];
var CLASSES=["GLA","PGL","MRD","LNC","ARC","CNJ","THM","ACN","ROG","BLU","BST"];
var iconsOn=false,IS_FILE=!(window.claude&&typeof window.claude.use==="function"),backupMsg="";
function iconUrl(i){var f=String(Math.floor(i/1000)*1000);while(f.length<6)f="0"+f;var n=String(i);while(n.length<6)n="0"+n;return "https://v2.xivapi.com/api/asset?path=ui/icon/"+f+"/"+n+".tex&format=png";}
function iconTag(ci){return iconsOn&&ci&&ci.i?'<img class="ic" loading="lazy" alt="" src="'+iconUrl(ci.i)+'">':'';}
function jobsShort(j){if(j==="All Classes")return "All jobs";return j.split(" ").filter(function(x){return CLASSES.indexOf(x)<0;}).join(" ");}
function fitsJob(x,job){return job==="all"||x.j==="All Classes"||x.j.split(" ").indexOf(job)>=0;}
function expOf(r){return (r.exp||"Other").split(" · ")[0];}
function raidOptions(sel,withAll){
  var html=withAll?'<option value="all">All raids</option>':'',groups=[];
  state.raids.forEach(function(r){var g=expOf(r);if(groups.indexOf(g)<0)groups.push(g);});
  groups.forEach(function(g){html+='<optgroup label="'+esc(g)+'">'+state.raids.filter(function(r){return expOf(r)===g;}).map(function(r){return '<option value="'+r.id+'"'+(r.id===sel?' selected':'')+'>'+esc(r.name)+'</option>';}).join('')+'</optgroup>';});
  return html;
}
var ui={group:"raid",filter:"all",hideGot:false,addRaid:null,addJob:"all",addSlots:[],addPick:[],addNote:"",confirmDel:null};
try{var u=JSON.parse(localStorage.getItem("glam-ledger-ui")||"null");if(u){ui.group=u.group||"raid";ui.hideGot=!!u.hideGot;ui.addJob=u.addJob||"all";}}catch(e){}
var artifactApi=null, mode="pending", saveTimer=null, saveState="ok";
var app=document.getElementById("app");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function raidById(id){for(var i=0;i<state.raids.length;i++)if(state.raids[i].id===id)return state.raids[i];return null;}
function slotName(s){return SLOT_LABEL[s]||s;}
function costOf(item){var r=raidById(item.raid);if(!r)return null;var c=r.costs[item.slot];return c?{floor:c[0],cost:c[1],label:r.floors[c[0]],token:r.tokens[c[0]]}:null;}
function dropsOf(item){var r=raidById(item.raid);if(!r||!r.drops[item.slot])return [];return r.drops[item.slot].map(function(f){return r.floors[f];});}
function books(rid){if(!state.books[rid])state.books[rid]=[0,0,0,0];return state.books[rid];}

function need(rid){
  var r=raidById(rid),n=[0,0,0,0];
  state.items.forEach(function(it){if(it.raid!==rid)return;var c=r.costs[it.slot];if(!c)return;
    if(it.status==="want")n[c[0]]+=c[1];});
  return n;
}

function saveUi(){try{localStorage.setItem("glam-ledger-ui",JSON.stringify({group:ui.group,hideGot:ui.hideGot,addJob:ui.addJob}));}catch(e){}}

function changed(){
  render();
  if(mode==="artifact"){saveState="busy";renderSave();clearTimeout(saveTimer);saveTimer=setTimeout(publish,1200);}
  else{try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
}

function buildDoc(){
  var headStyle=document.head.querySelector("style");
  var reset=headStyle?headStyle.textContent:":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}";
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var S="scr"+"ipt";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>Glamour Raid Ledger</title>\n'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">\n'+
    '<style id="appstyle">'+document.getElementById("appstyle").textContent+'</style>\n'+
    '<div id="app"></div>\n'+
    '<'+S+' type="application/json" id="state">'+json+'</'+S+'>\n'+
    '<'+S+' type="application/json" id="catalog">'+document.getElementById("catalog").textContent+'</'+S+'>\n'+
    '<'+S+' id="main">'+document.getElementById("main").textContent+'</'+S+'>'+
    '</body></html>';
}

function publish(){
  if(!artifactApi)return;
  artifactApi.publish(buildDoc()).then(function(){saveState="ok";renderSave();},function(err){
    var code=err&&err.code;
    if(code==="conflict"){saveState="ok";}
    else if(code==="not_granted"||code==="not_writer"){mode="local";saveState="readonly";try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
    else{saveState="error";}
    renderSave();
  });
}

function renderSave(){
  var el=document.getElementById("savestatus");if(!el)return;
  var t,c;
  if(mode==="pending"){t="Connecting…";c="busy";}
  else if(mode==="local"){t=saveState==="readonly"?"View only · changes stay in this browser":"Saved in this browser";c="local";}
  else if(saveState==="busy"){t="Saving…";c="busy";}
  else if(saveState==="error"){t="Couldn't save. Your next change will retry.";c="busy";}
  else{t="All changes saved";c="ok";}
  el.textContent=t;el.className="save "+c;
}

function statusBtns(it){
  return '<div class="status" role="group" aria-label="Status">'+
    ['want','coffer','got'].map(function(s){var lab={want:"Want",coffer:"Coffer",got:"Got"}[s];
      return '<button type="button" class="'+s+'" data-act="status" data-id="'+it.id+'" data-v="'+s+'" aria-pressed="'+(it.status===s)+'">'+lab+'</button>';}).join('')+'</div>';
}

function itemRow(it,showRaid){
  var r=raidById(it.raid),c=costOf(it);
  var sub=[];
  if(showRaid&&r)sub.push(esc(r.name));
  var d=dropsOf(it);
  if(d.length)sub.push('drops in '+esc(d.join(', ')));
  if(it.note)sub.push(esc(it.note));
  var ci=it.item&&CAT_BY_ID[it.item];
  var primary=ci?iconTag(ci)+esc(ci.n):(r?esc(r.set||r.name)+' '+esc(slotName(it.slot)):esc(slotName(it.slot)));
  if(ci)sub.push(esc(jobsShort(ci.j)));
  return '<div class="item'+(it.status!=="want"?" done":"")+'">'+
    '<div class="slotcol slot">'+esc(slotName(it.slot))+'</div>'+
    '<div class="main"><span>'+primary+(it.ex?'<span class="ex">example</span>':'')+'</span>'+
      '<span class="sub">'+sub.join(' · ')+(c?' · <span class="num">'+c.cost+'</span> × '+esc(c.token):' · no book exchange')+'</span></div>'+
    statusBtns(it)+
    '<button type="button" class="btn ghost del" data-act="del" data-id="'+it.id+'" aria-label="Remove '+esc(slotName(it.slot))+'">✕</button>'+
  '</div>';
}

function pieceList(){
  var list=CATALOG[ui.addRaid],r=raidById(ui.addRaid);
  if(!list||!r)return '<div class="emptypick">This raid has no item list. Pick slots above and they are added as general pieces.</div>';
  var have={};state.items.forEach(function(i){if(i.item)have[i.item]=1;});
  var shown=list.filter(function(x){return fitsJob(x,ui.addJob)&&(!ui.addSlots.length||ui.addSlots.indexOf(x.s)>=0);});
  if(!shown.length)return '<div class="emptypick">No pieces match this job and slot filter.</div>';
  return SLOTS.map(function(sl){var g=shown.filter(function(x){return x.s===sl;});if(!g.length)return '';var c=r.costs[sl];
    return '<h4>'+esc(slotName(sl))+(c?' · '+c[1]+' × '+esc(r.floors[c[0]])+' book':'')+'</h4>'+g.map(function(x){var on=!!have[x.id],chk=ui.addPick.indexOf(x.id)>=0;
      return '<label class="'+(on?'on':'')+'"><input type="checkbox" id="pk-'+x.id+'" data-act="pick" data-id="'+x.id+'"'+(chk?' checked':'')+(on?' disabled':'')+'><span>'+iconTag(x)+esc(x.n)+'<div class="jobs">'+esc(jobsShort(x.j))+'</div></span><span class="pc">'+(on?'on your list':'')+'</span></label>';}).join('');}).join('');
}
function shownIds(){var list=CATALOG[ui.addRaid]||[],have={};state.items.forEach(function(i){if(i.item)have[i.item]=1;});
  return list.filter(function(x){return !have[x.id]&&fitsJob(x,ui.addJob)&&(!ui.addSlots.length||ui.addSlots.indexOf(x.s)>=0);}).map(function(x){return x.id;});}

function wishlist(){
  var items=state.items.filter(function(it){
    if(ui.filter!=="all"&&it.raid!==ui.filter)return false;
    if(ui.hideGot&&it.status!=="want")return false;return true;});
  if(!items.length)return '<div class="empty">Nothing here yet. Pick a raid and some slots above to start your wishlist.</div>';
  var groups=[];
  if(ui.group==="raid"){
    state.raids.forEach(function(r){var g=items.filter(function(i){return i.raid===r.id;});
      if(g.length){g.sort(function(a,b){return SLOTS.indexOf(a.slot)-SLOTS.indexOf(b.slot);});groups.push({title:r.name,meta:r.exp,items:g,showRaid:false});}});
  }else{
    SLOTS.forEach(function(s){var g=items.filter(function(i){return i.slot===s;});
      if(g.length){g.sort(function(a,b){return state.raids.findIndex(function(r){return r.id===a.raid;})-state.raids.findIndex(function(r){return r.id===b.raid;});});groups.push({title:slotName(s),meta:"",items:g,showRaid:true});}});
  }
  return groups.map(function(g){
    var open=g.items.filter(function(i){return i.status==="want";}).length;
    return '<section class="group"><div class="group-head"><h3>'+esc(g.title)+'</h3><span class="small muted num">'+(g.meta?esc(g.meta)+' · ':'')+open+' still wanted · '+g.items.length+' total</span></div>'+
      g.items.map(function(i){return itemRow(i,g.showRaid);}).join('')+'</section>';
  }).join('');
}

function calculator(){
  var raids=state.raids.filter(function(r){return state.items.some(function(i){return i.raid===r.id;});});
  if(!raids.length)return '<p class="muted small">Add wishlist items and the book totals for each raid appear here.</p>';
  return raids.map(function(r){
    var n=need(r.id),b=books(r.id),runs=0;
    var rows=r.floors.map(function(f,fi){
      var left=Math.max(0,n[fi]-b[fi]);runs+=left;
      return '<tr><td>'+esc(f)+'<div class="small muted" style="font-weight:400">'+esc(r.tokens[fi])+'</div></td><td>'+n[fi]+'</td><td><span class="owned">'+
        '<button type="button" data-act="book" data-r="'+r.id+'" data-f="'+fi+'" data-d="-1" aria-label="One fewer '+esc(f)+' book">−</button>'+
        '<input type="number" min="0" id="own-'+r.id+'-'+fi+'" data-act="bookset" data-r="'+r.id+'" data-f="'+fi+'" value="'+b[fi]+'" aria-label="'+esc(f)+' books owned">'+
        '<button type="button" data-act="book" data-r="'+r.id+'" data-f="'+fi+'" data-d="1" aria-label="One more '+esc(f)+' book">+</button></span></td>'+
        '<td class="farm '+(left?'more':'zero')+'">'+(n[fi]===0?'<span class="muted">–</span>':(left?left:'✓'))+'</td></tr>';
    }).join('');
    return '<div class="calc-raid"><div class="row spread"><h3>'+esc(r.name)+'</h3></div>'+
      '<table class="calc-table"><thead><tr><th>Floor book</th><th>Needed</th><th>Owned</th><th>Clears left</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<div class="total"><span class="muted small">One book per clear. Total clears still to farm</span><strong class="num">'+runs+'</strong></div></div>';
  }).join('');
}

function settings(){
  return '<details class="settings panel" id="settings"><summary>Raids & exchange rates</summary>'+
    '<p class="small muted" style="margin:0">Every savage tier with a book exchange is filled in, from Alexander to Arcadion. Each slot is bought with one floor\'s books, and its coffer can drop from one or more floors. Edit anything here if the game changes.</p>'+
    state.raids.map(function(r){
      return '<div class="raid-edit"><div class="row">'+
        '<div class="field grow"><label class="label" for="rn-'+r.id+'">Raid</label><input type="text" id="rn-'+r.id+'" data-act="rfield" data-r="'+r.id+'" data-k="name" value="'+esc(r.name)+'"></div>'+
        '<div class="field grow"><label class="label" for="rs-'+r.id+'">Gear set name</label><input type="text" id="rs-'+r.id+'" data-act="rfield" data-r="'+r.id+'" data-k="set" value="'+esc(r.set||"")+'"></div>'+
        '<div class="field grow"><label class="label" for="re-'+r.id+'">Expansion / patch</label><input type="text" id="re-'+r.id+'" data-act="rfield" data-r="'+r.id+'" data-k="exp" value="'+esc(r.exp||"")+'"></div></div>'+
        '<div class="field"><span class="label">Floor names</span><div class="floors">'+r.floors.map(function(f,fi){return '<input type="text" id="rf-'+r.id+'-'+fi+'" aria-label="Floor '+(fi+1)+' name" data-act="rfloor" data-r="'+r.id+'" data-f="'+fi+'" value="'+esc(f)+'">';}).join('')+'</div></div>'+
        '<div class="field"><span class="label">Book names</span><div class="floors">'+r.tokens.map(function(t,fi){return '<input type="text" style="width:190px" id="rt-'+r.id+'-'+fi+'" aria-label="'+esc(r.floors[fi])+' book name" data-act="rtoken" data-r="'+r.id+'" data-f="'+fi+'" value="'+esc(t)+'">';}).join('')+'</div></div>'+
        '<div class="cost-grid"><table><thead><tr><th class="label">Slot</th><th class="label">Book from</th><th class="label">Cost</th><th class="label">Coffer drops on</th></tr></thead><tbody>'+
        SLOTS.map(function(s){var c=r.costs[s]||[0,0];return '<tr><td>'+esc(slotName(s))+'</td><td><select id="cf-'+r.id+'-'+s+'" data-act="cfloor" data-r="'+r.id+'" data-s="'+s+'">'+r.floors.map(function(f,fi){return '<option value="'+fi+'"'+(fi===c[0]?' selected':'')+'>'+esc(f)+'</option>';}).join('')+'</select></td><td><input type="number" min="0" id="cc-'+r.id+'-'+s+'" data-act="ccost" data-r="'+r.id+'" data-s="'+s+'" value="'+c[1]+'"></td><td style="white-space:nowrap">'+r.floors.map(function(f,fi){var on=(r.drops[s]||[]).indexOf(fi)>=0;return '<label class="small" style="margin-right:8px"><input type="checkbox" id="cd-'+r.id+'-'+s+'-'+fi+'" data-act="cdrop" data-r="'+r.id+'" data-s="'+s+'" data-f="'+fi+'"'+(on?' checked':'')+'> '+esc(f)+'</label>';}).join('')+'</td></tr>';}).join('')+
        '</tbody></table></div>'+
        '<div>'+(ui.confirmDel===r.id?'<span class="small">Remove this raid and its '+state.items.filter(function(i){return i.raid===r.id;}).length+' wishlist items? </span><button type="button" class="btn danger" data-act="delraid" data-r="'+r.id+'">Remove raid</button> <button type="button" class="btn" data-act="canceldel">Keep it</button>':'<button type="button" class="btn danger" data-act="askdel" data-r="'+r.id+'">Remove raid…</button>')+'</div>'+
      '</div>';
    }).join('')+
    '<div><button type="button" class="btn primary" data-act="addraid">Add a raid</button></div></details>';
}

function render(){
  var settingsOpen=document.getElementById("settings")&&document.getElementById("settings").open;
  var active=document.activeElement&&document.activeElement.id,selStart=null;
  try{if(active&&document.activeElement.selectionStart!=null)selStart=document.activeElement.selectionStart;}catch(e){}
  if(!ui.addRaid||!raidById(ui.addRaid))ui.addRaid=state.raids[0]?state.raids[0].id:null;
  var hasEx=state.items.some(function(i){return i.ex;});
  var addR=raidById(ui.addRaid);
  app.innerHTML=
    '<header><div><h1>Glamour Raid Ledger</h1><p class="muted">Track the savage pieces you want for glamour across every tier from Alexander to Arcadion, which floor drops them, and how many books you still need to farm.'+(IS_FILE?' Your list saves in this browser. Use Export backup to keep a copy or move it to another device.':'')+'</p></div><div class="field" style="align-items:flex-end"><span id="savestatus" class="save"></span>'+(IS_FILE?'<div class="backup"><button type="button" class="btn" data-act="export">Export backup</button><button type="button" class="btn" data-act="import">Import backup</button><input type="file" id="importfile" accept="application/json,.json" hidden><span class="msg">'+esc(backupMsg)+'</span></div>':'')+'</div></header>'+
    (hasEx?'<div class="notice"><span>The entries marked <span class="ex" style="margin:0">example</span> show how the ledger works. Remove them when you add your own.</span><button type="button" class="btn" data-act="clearex">Remove examples</button></div>':'')+
    '<div class="layout"><div style="display:flex;flex-direction:column;gap:20px;min-width:0">'+
      '<form class="panel" id="addform"><h2>Add to wishlist</h2>'+
        '<div class="row"><div class="field grow"><label class="label" for="add-raid">Raid</label><select id="add-raid" data-act="addraid-sel">'+raidOptions(ui.addRaid,false)+'</select></div>'+
        '<div class="field grow"><label class="label" for="add-job">Glamour for</label><select id="add-job" data-act="addjob"><option value="all">Any job</option>'+JOBS.map(function(j){return '<option value="'+j+'"'+(ui.addJob===j?' selected':'')+'>'+j+'</option>';}).join('')+'</select></div></div>'+
        '<div class="field"><span class="label">Slots · leave empty to show all</span><div class="chips">'+SLOTS.map(function(s){return '<button type="button" class="chip" data-act="slot" data-s="'+s+'" aria-pressed="'+(ui.addSlots.indexOf(s)>=0)+'">'+esc(slotName(s))+'</button>';}).join('')+'</div></div>'+
        '<div class="pick" id="pick">'+pieceList()+'</div>'+
        '<div class="field"><label class="label" for="add-note">Note (optional)</label><input type="text" id="add-note" placeholder="e.g. dyed black, for the summer glam" value="'+esc(ui.addNote)+'"></div>'+
        (function(){var generic=!CATALOG[ui.addRaid];var n=generic?ui.addSlots.length:ui.addPick.length;
          return '<div class="row"><button type="submit" class="btn primary"'+(n?'':' disabled')+'>Add '+(n||'')+' piece'+(n===1?'':'s')+'</button>'+(generic?'':'<button type="button" class="btn" data-act="selall">Select all shown</button>'+(ui.addPick.length?'<button type="button" class="btn ghost" data-act="selnone">Clear selection</button>':''))+'</div>';})()+
      '</form>'+
      '<div class="panel"><div class="row spread"><h2>Wishlist</h2><div class="row">'+
        '<div class="seg" role="group" aria-label="Group by"><button type="button" data-act="group" data-v="raid" aria-pressed="'+(ui.group==="raid")+'">By raid</button><button type="button" data-act="group" data-v="slot" aria-pressed="'+(ui.group==="slot")+'">By slot</button></div>'+
        '<select id="filter" aria-label="Show raid" data-act="filter">'+raidOptions(ui.filter,true)+'</select>'+
        '<label class="small row" style="gap:6px"><input type="checkbox" id="hidegot" data-act="hidegot"'+(ui.hideGot?' checked':'')+'> Only still wanted</label>'+
      '</div></div>'+
      '<p class="small muted" style="margin:0">Want counts toward books. Coffer means it dropped and you hold the coffer. Got means it\'s in your dresser.</p>'+
      wishlist()+'</div>'+
      settings()+
    '</div>'+
    '<aside class="panel"><h2>Book calculator</h2><div class="calc">'+calculator()+'</div></aside></div>';
  if(settingsOpen)document.getElementById("settings").open=true;
  if(active){var el=document.getElementById(active);if(el){el.focus();try{if(selStart!=null)el.setSelectionRange(selStart,selStart);}catch(e){}}}
  renderSave();
}

app.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t||t.tagName==="INPUT"||t.tagName==="SELECT")return;
  var a=t.dataset.act;
  if(a==="slot"){var s=t.dataset.s,i=ui.addSlots.indexOf(s);if(i>=0)ui.addSlots.splice(i,1);else ui.addSlots.push(s);keepNote();render();}
  else if(a==="selall"){shownIds().forEach(function(id){if(ui.addPick.indexOf(id)<0)ui.addPick.push(id);});keepNote();render();}
  else if(a==="selnone"){ui.addPick=[];keepNote();render();}
  else if(a==="export"){try{var blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});var aEl=document.createElement("a");aEl.href=URL.createObjectURL(blob);aEl.download="glam-ledger-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(aEl);aEl.click();aEl.remove();backupMsg="Backup saved to your downloads.";}catch(err){backupMsg="Export failed: "+err.message;}render();}
  else if(a==="import"){document.getElementById("importfile").click();}
  else if(a==="status"){var it=state.items.find(function(x){return x.id===t.dataset.id;});if(it){it.status=t.dataset.v;changed();}}
  else if(a==="del"){state.items=state.items.filter(function(x){return x.id!==t.dataset.id;});changed();}
  else if(a==="group"){ui.group=t.dataset.v;saveUi();render();}
  else if(a==="book"){var b=books(t.dataset.r),f=+t.dataset.f;b[f]=Math.max(0,b[f]+(+t.dataset.d));changed();}
  else if(a==="clearex"){state.items=state.items.filter(function(x){return !x.ex;});Object.keys(state.books).forEach(function(k){state.books[k]=[0,0,0,0];});changed();}
  else if(a==="addraid"){var id=uid();state.raids.push({id:id,name:"New raid",exp:"",set:"",floors:["Floor 1","Floor 2","Floor 3","Floor 4"],tokens:["Book I","Book II","Book III","Book IV"],costs:JSON.parse(JSON.stringify(DEFAULT_COSTS)),drops:{}});normalize(state);state.books[id]=[0,0,0,0];changed();document.getElementById("settings").open=true;var n=document.getElementById("rn-"+id);if(n){n.focus();n.select();}}
  else if(a==="askdel"){ui.confirmDel=t.dataset.r;render();}
  else if(a==="canceldel"){ui.confirmDel=null;render();}
  else if(a==="delraid"){var r=t.dataset.r;state.raids=state.raids.filter(function(x){return x.id!==r;});state.items=state.items.filter(function(x){return x.raid!==r;});delete state.books[r];if(ui.filter===r)ui.filter="all";ui.confirmDel=null;changed();}
});

app.addEventListener("change",function(e){
  var t=e.target,a=t.dataset.act;if(!a)return;
  if(t.id==="importfile"&&t.files&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!d.raids||!d.items)throw new Error("This file isn't a ledger backup.");state=normalize(d);backupMsg="Imported "+state.items.length+" pieces.";changed();}catch(err){backupMsg="Couldn't import: "+err.message;render();}};fr.readAsText(t.files[0]);return;}
  if(a==="addraid-sel"){ui.addRaid=t.value;ui.addPick=[];keepNote();render();}
  else if(a==="addjob"){ui.addJob=t.value;saveUi();keepNote();render();}
  else if(a==="pick"){var pid=+t.dataset.id,pi=ui.addPick.indexOf(pid);if(t.checked&&pi<0)ui.addPick.push(pid);if(!t.checked&&pi>=0)ui.addPick.splice(pi,1);keepNote();var sc=document.getElementById("pick").scrollTop;render();document.getElementById("pick").scrollTop=sc;}
  else if(a==="filter"){ui.filter=t.value;render();}
  else if(a==="hidegot"){ui.hideGot=t.checked;saveUi();render();}
  else if(a==="bookset"){books(t.dataset.r)[+t.dataset.f]=Math.max(0,parseInt(t.value,10)||0);changed();}
  else if(a==="rfield"){var r=raidById(t.dataset.r);if(r){r[t.dataset.k]=t.value.trim()||(t.dataset.k==="name"?"Untitled raid":"");changed();}}
  else if(a==="rfloor"){var r2=raidById(t.dataset.r);if(r2){r2.floors[+t.dataset.f]=t.value.trim()||("Floor "+(+t.dataset.f+1));changed();}}
  else if(a==="rtoken"){var rt=raidById(t.dataset.r);if(rt){rt.tokens[+t.dataset.f]=t.value.trim()||(rt.floors[+t.dataset.f]+" book");changed();}}
  else if(a==="cdrop"){var rd=raidById(t.dataset.r);if(rd){var arr=(rd.drops[t.dataset.s]||[]).filter(function(x){return x!==+t.dataset.f;});if(t.checked)arr.push(+t.dataset.f);arr.sort();rd.drops[t.dataset.s]=arr;changed();}}
  else if(a==="cfloor"){var r3=raidById(t.dataset.r);if(r3){r3.costs[t.dataset.s]=[+t.value,(r3.costs[t.dataset.s]||[0,0])[1]];changed();}}
  else if(a==="ccost"){var r4=raidById(t.dataset.r);if(r4){r4.costs[t.dataset.s]=[(r4.costs[t.dataset.s]||[0,0])[0],Math.max(0,parseInt(t.value,10)||0)];changed();}}
});

function keepNote(){var n=document.getElementById("add-note");if(n)ui.addNote=n.value;}
app.addEventListener("submit",function(e){
  e.preventDefault();
  if(!ui.addRaid)return;
  var note=document.getElementById("add-note").value.trim();
  if(CATALOG[ui.addRaid]){
    if(!ui.addPick.length)return;
    ui.addPick.map(function(id){return CAT_BY_ID[id];}).sort(function(a,b){return SLOTS.indexOf(a.s)-SLOTS.indexOf(b.s);}).forEach(function(x){state.items.push({id:uid(),raid:ui.addRaid,slot:x.s,item:x.id,note:note,status:"want"});});
    ui.addPick=[];
  }else{
    if(!ui.addSlots.length)return;
    ui.addSlots.slice().sort(function(a,b){return SLOTS.indexOf(a)-SLOTS.indexOf(b);}).forEach(function(s){state.items.push({id:uid(),raid:ui.addRaid,slot:s,note:note,status:"want"});});
    ui.addSlots=[];
  }
  ui.addNote="";changed();
});

render();

(function(){var probe=new Image();probe.onload=function(){iconsOn=true;render();};probe.src=iconUrl(CATALOG.hw&&CATALOG.hw[0]?CATALOG.hw[0].i:30700);})();
var settled=false;
function goLocal(){
  if(settled)return;settled=true;mode="local";
  try{var saved=localStorage.getItem(LS_KEY);if(saved){state=normalize(JSON.parse(saved));}}catch(e){}
  render();
}
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(api){
    if(settled)return;
    if(api){settled=true;artifactApi=api;mode="artifact";saveState="ok";renderSave();}
    else goLocal();
  },goLocal);
}else{goLocal();}
})();
</script>

</body>
